<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icon files (below, and in public/manifest.webmanifest) are cached
      aggressively — by our own service worker (cache-first for static
      assets) and by Brave/Chromium's installed-PWA icon, which doesn't
      recheck the manifest on every launch. Their filenames never change on
      their own, so replacing icon bytes without renaming leaves everyone
      stuck on the old icon indefinitely. Whenever you swap an icon file,
      bump every "?v=N" below (and the matching ones in manifest.webmanifest)
      by one — that turns it into a new URL, which both caches treat as a
      fresh resource instead of stale bytes to reuse. An already-installed
      PWA still needs a reinstall to pick up the new icon; the version bump
      is what makes a *fresh* install (or a browser tab) always get the
      latest one instead of whatever got cached first.
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=1" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png?v=1" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="DeltraOS — a disciplined trading journal and capital plan tracker." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Chivo+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>DeltraOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Resolved relative to this page, so it works whether the app is
          // served from the site root or a subpath (e.g. GitHub Pages).
          navigator.serviceWorker.register(new URL('sw.js', document.baseURI)).catch(() => {});
        });
      }
    </script>
  </body>
</html>
